[package]
name = "deptty"
version = "0.1.0"
edition = "2024"
description = "deepin-terminal rewritten in Rust on DTK6"
license = "GPL-3.0-or-later"
repository = "https://github.com/st0nie/deptty"

[dependencies]
dtk = { git = "https://github.com/st0nie/dtk-rs" }
alacritty_terminal = "0.26"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
dirs = "6"
libc = "0.2"
rust-i18n = "4"

[package.metadata.deb]
maintainer = "st0nie"
section = "utils"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/deptty", "usr/bin/", "755"],
    ["assets/deptty.desktop", "usr/share/applications/", "644"],
    ["themes/*.toml", "usr/share/deptty/themes/", "644"],
]
